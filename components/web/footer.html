<!-- EP web footer — generated at build time from ep-brand-assets -->
<footer class="ep-footer" aria-labelledby="ep-footer-title">
  <div class="ep-footer__inner">
    <p class="ep-footer__eyebrow">GET IN TOUCH</p>
    <h2 id="ep-footer-title">Let's Connect</h2>
    <p class="ep-footer__intro">Interested in discussing data analytics, business insights or professional opportunities? Let's connect.</p>
    <div class="ep-footer__contacts">
      <a class="ep-footer__contact" href="{{linkedin}}" target="_blank" rel="noopener noreferrer">
        <img src="{{linkedin_src}}" width="30" height="30" alt="" aria-hidden="true">
        <strong>LinkedIn</strong><span>Professional network</span><b>View profile</b>
      </a>
      <a class="ep-footer__contact" href="mailto:{{email}}">
        <img src="{{gmail_src}}" width="30" height="30" alt="" aria-hidden="true">
        <strong>Email</strong><span>Direct contact</span><b>Send email</b>
      </a>
    </div>
    <a class="ep-footer__website" href="{{website}}" target="_blank" rel="noopener noreferrer">Personal Website</a>
    <div class="ep-footer__bottom">
      <small>© {{year}} {{name}}</small>
      <small>Data Science Portfolio</small>
    </div>
  </div>
</footer>
