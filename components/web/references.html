<section id="references" class="ep-references" aria-labelledby="ep-references-title">
  <h2 id="ep-references-title" class="section-heading">$title</h2>
  <div class="ep-references__grid">$cards</div>
</section>
<!-- EP-REFERENCE-CARD -->
<article class="ep-reference-card $modifier">
  <div class="ep-reference-card__heading">$icon<h3>$title</h3></div>
  $content
</article>
<!-- EP-REFERENCE-STEP -->
<li class="ep-reference-step">$label$command</li>
<!-- EP-REFERENCE-COMMAND -->
<div class="ep-reference-command"><pre><code>$command</code></pre><button type="button" class="ep-reference-copy" data-ep-copy hidden>$copy_icon$check_icon<span class="ep-reference-copy__label">$label</span></button><span class="ep-reference-copy__status" role="status" aria-live="polite"></span></div>
